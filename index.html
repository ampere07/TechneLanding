<!doctype html>
<html lang="en" class="is-loading">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="description" content="Techne is a carrier-neutral network provider in the Philippines offering colocation, IP transit, content access, virtual cross connects, virtual switches, virtual routers and network consulting." />
  <title>Techne: Colocation, IP Transit and Virtual Interconnection in the Philippines</title>
  <style>
    /* The splash screen. It is plain HTML and CSS in this file, so it shows before any script has loaded. */
    html.is-loading, html.is-loading body { overflow: hidden; }
    /* Keep the splash as designed under a forced-colours or high contrast setting. */
    #splash, #splash * { forced-color-adjust: none; }
    #splash {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: #f3f6f8; color: #0b2536;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity 0.55s ease, visibility 0s linear 0.55s;
    }
    #splash.splash--out { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash__inner { display: flex; flex-direction: column; align-items: center; padding: 24px; text-align: center; }
    .splash__brand { display: flex; align-items: center; gap: 12px; }
    .splash__brand img { height: 40px; width: auto; display: block; }
    .splash__brand span { font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; font-size: 1.75rem; letter-spacing: -0.01em; }

    /* The stage holds the 3D rack. Until that has loaded, a flat row of racks that go up one after another stands in for it. */
    .splash__stage { position: relative; width: min(340px, 84vw); height: min(290px, 72vw); margin-top: 8px; }
    .splash__hall { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 7px; height: 52px; padding-bottom: 5px; border-bottom: 1px solid #b4c1ca; }
    .splash__stage--3d .splash__hall { display: none; }
    .splash__rack {
      width: 17px; height: 46px; border-radius: 2px; background: #b4c1ca; transform-origin: bottom;
      background-image: repeating-linear-gradient(to bottom, transparent 0 5px, rgba(255,255,255,0.55) 5px 6px);
      animation: splash-rack 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .splash__rack:nth-child(1) { animation-delay: 0.10s; height: 36px; }
    .splash__rack:nth-child(2) { animation-delay: 0.22s; height: 44px; }
    .splash__rack:nth-child(3) { animation-delay: 0.34s; height: 50px; background-color: #0e6b70; }
    .splash__rack:nth-child(4) { animation-delay: 0.46s; height: 44px; }
    .splash__rack:nth-child(5) { animation-delay: 0.58s; height: 36px; }
    @keyframes splash-rack { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

    .splash__tag { margin: 6px 0 0; font-size: 0.875rem; line-height: 1.4; color: #455a68; max-width: 260px; opacity: 0; animation: splash-fade 0.5s ease 0.5s forwards; }
    @keyframes splash-fade { to { opacity: 1; } }

    .splash__bar { width: 168px; height: 2px; margin-top: 20px; background: #d8e0e6; border-radius: 2px; overflow: hidden; }
    .splash__bar i { display: block; height: 100%; width: 0; background: #0e6b70; animation: splash-bar 1.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards; }
    #splash.splash--ready .splash__bar i { animation: none; width: 100%; transition: width 0.25s ease; }
    @keyframes splash-bar { to { width: 88%; } }

    @media (prefers-reduced-motion: reduce) {
      /* The racks and the bar still run, since they are the loading indicator. Only the fade is shortened. */
      #splash { transition-duration: 0.2s; }
    }
  </style>
</head>

<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Loading Techne">
    <div class="splash__inner">
      <div class="splash__brand">
        <img src="/src/assets/logo.png" alt="" width="40" height="40" />
        <span>Techne</span>
      </div>
      <div class="splash__stage" id="splash-stage" aria-hidden="true">
        <div class="splash__hall">
          <div class="splash__rack"></div>
          <div class="splash__rack"></div>
          <div class="splash__rack"></div>
          <div class="splash__rack"></div>
          <div class="splash__rack"></div>
        </div>
      </div>
      <p class="splash__tag">Carrier-neutral network services for the Philippines</p>
      <div class="splash__bar" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    // If the app never starts, do not leave visitors looking at the splash screen.
    window.setTimeout(function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.classList.add('splash--out'); document.documentElement.classList.remove('is-loading'); }
    }, 10000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
