<!doctype html>
<html lang="en" class="is-loading">

<head>
  <meta charset="UTF-8" />
  <script>
    /* Light is the default. Dark is used only if the visitor chose it earlier. Set before the first paint, so there is no flash. */
    try { if (localStorage.getItem('techne-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { }
  </script>
  <link rel="icon" type="image/png" href="/src/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <meta name="description"
    content="Techne is a carrier-neutral network provider in the Philippines: IP transit, Metro-E, colocation, content access, virtual interconnection and network consulting, with a 24/7 NOC." />
  <title>Techne | IP Transit, Colocation &amp; Network Consulting in the Philippines</title>
  <link rel="canonical" href="https://techne.ph/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- How a link to the site looks when it is shared on Facebook, Viber, LinkedIn and similar. Those services do not run the page's code, so they read these tags. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Techne" />
  <meta property="og:locale" content="en_PH" />
  <meta property="og:title" content="Techne | IP Transit, Colocation &amp; Network Consulting in the Philippines" />
  <meta property="og:description"
    content="Techne is a carrier-neutral network provider in the Philippines: IP transit, Metro-E, colocation, content access, virtual interconnection and network consulting, with a 24/7 NOC." />
  <meta property="og:url" content="https://techne.ph/" />
  <meta property="og:image" content="https://techne.ph/og-logo.png" />
  <meta property="og:image:alt" content="Techne logo" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Techne | IP Transit, Colocation &amp; Network Consulting in the Philippines" />
  <meta name="twitter:description"
    content="Techne is a carrier-neutral network provider in the Philippines: IP transit, Metro-E, colocation, content access, virtual interconnection and network consulting, with a 24/7 NOC." />
  <meta name="twitter:image" content="https://techne.ph/og-logo.png" />

  <!-- Tells search engines who Techne is, so the name, logo and contact details can appear in results. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://techne.ph/#organization",
          "name": "Techne",
          "alternateName": "Techne Consulting",
          "url": "https://techne.ph/",
          "logo": "https://techne.ph/og-logo.png",
          "email": "info@techne.ph",
          "telephone": "+63 968 702 8433",
          "description": "Carrier-neutral network provider in the Philippines offering IP transit, Metro-E, colocation, content access, virtual interconnection and network consulting.",
          "address": { "@type": "PostalAddress", "addressLocality": "Cebu City", "addressCountry": "PH" },
          "areaServed": { "@type": "Country", "name": "Philippines" },
          "sameAs": ["https://www.facebook.com/techne.consulting"]
        },
        {
          "@type": "WebSite",
          "@id": "https://techne.ph/#website",
          "url": "https://techne.ph/",
          "name": "Techne",
          "publisher": { "@id": "https://techne.ph/#organization" }
        }
      ]
    }
  </script>
  <noscript>
    <style>
      #splash {
        display: none;
      }
    </style>
  </noscript>
  <style>
    /* The splash screen. It is plain HTML and CSS in this file, so it shows before any script has loaded. */
    html.is-loading,
    html.is-loading body {
      overflow: hidden;
    }

    /* Keep the splash as designed under a forced-colours or high contrast setting. */
    #splash,
    #splash * {
      forced-color-adjust: none;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6f8;
      color: #0b2536;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity 0.55s ease, visibility 0s linear 0.55s;
    }

    html[data-theme='dark'] #splash {
      background: #0a1721;
      color: #e9f0f4;
    }

    #splash.splash--out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .splash__brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .splash__brand img {
      height: 40px;
      width: auto;
      display: block;
    }

    .splash__brand span {
      font-family: 'Archivo', system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      letter-spacing: -0.01em;
    }

    /* The stage holds the 3D rack, which is drawn into it as soon as its code has loaded. */
    .splash__stage {
      position: relative;
      width: min(340px, 84vw);
      height: min(290px, 72vw);
      margin-top: 8px;
    }

    .splash__tag {
      margin: 6px 0 0;
      font-size: 0.875rem;
      line-height: 1.4;
      color: #455a68;
      max-width: 260px;
      opacity: 0;
      animation: splash-fade 0.5s ease 0.5s forwards;
    }

    @keyframes splash-fade {
      to {
        opacity: 1;
      }
    }

    .splash__bar {
      width: 168px;
      height: 2px;
      margin-top: 20px;
      background: #d8e0e6;
      border-radius: 2px;
      overflow: hidden;
    }

    .splash__bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #0e6b70;
      animation: splash-bar 1.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    #splash.splash--ready .splash__bar i {
      animation: none;
      width: 100%;
      transition: width 0.25s ease;
    }

    @keyframes splash-bar {
      to {
        width: 88%;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      /* The rack and the bar still run, since they are the loading indicator. Only the fade is shortened. */
      #splash {
        transition-duration: 0.2s;
      }
    }
  </style>
</head>

<body>
  <div id="splash" role="status" aria-live="polite" aria-label="Loading Techne">
    <div class="splash__inner">
      <div class="splash__brand">
        <img src="/src/assets/logo.png" alt="" width="40" height="40" />
        <span>Techne</span>
      </div>
      <div class="splash__stage" id="splash-stage" aria-hidden="true"></div>
      <p class="splash__tag">Carrier-neutral network services for the Philippines</p>
      <div class="splash__bar" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <div id="root"></div>
  <noscript>
    <main style="max-width: 720px; margin: 0 auto; padding: 48px 20px; font-family: system-ui, sans-serif; line-height: 1.6;">
      <h1>Techne: IP transit, colocation and network consulting in the Philippines</h1>
      <p>Techne is a carrier-neutral network provider in the Philippines. It offers IP transit, Metro-E, colocation, content access, virtual cross connects, virtual switches, virtual routers and network consulting, with a 24/7 network operations center at Vitro Makati 2 in Manila.</p>
      <p>This site needs JavaScript to show its pages. To reach Techne, email <a href="mailto:info@techne.ph">info@techne.ph</a> or call +63 968 702 8433.</p>
    </main>
  </noscript>
  <script>
    // If the app never starts, do not leave visitors looking at the splash screen.
    window.setTimeout(function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.classList.add('splash--out'); document.documentElement.classList.remove('is-loading'); }
    }, 10000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
